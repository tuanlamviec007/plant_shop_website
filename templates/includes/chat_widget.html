<!-- Chat Widget -->
<!-- Thêm thư viện marked.js để render markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div id="chat-widget-container">
    <!-- Chat Button -->
    <button id="chat-toggle-btn" class="chat-btn shadow-lg" onclick="toggleChat()">
        <i class="fas fa-robot fa-lg"></i>
        <span class="chat-btn-text">Tư vấn bằng AI</span>
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle" id="chat-badge" style="display: none;">
            <span class="visually-hidden">New alerts</span>
        </span>
    </button>

    <!-- Chat Box -->
    <div id="chat-box" class="chat-box shadow-lg d-none">
        <div class="chat-header bg-success text-white d-flex justify-content-between align-items-center p-3">
            <div class="d-flex align-items-center">
                <div class="bg-white text-success rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                    <i class="fas fa-robot"></i>
                </div>
                <div>
                    <h6 class="mb-0 fw-bold">Gemini AI Assistant</h6>
                    <small class="text-white-50"><i class="fas fa-circle text-warning me-1" style="font-size: 8px;"></i>Đang trực tuyến</small>
                </div>
            </div>
            <button type="button" class="btn-close btn-close-white" onclick="toggleChat()"></button>
        </div>

        <div id="chat-messages" class="chat-messages p-3">
            <!-- Messages will appear here -->
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator p-3 d-none">
            <div class="d-flex align-items-center">
                <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 28px; height: 28px;">
                    <i class="fas fa-robot text-success" style="font-size: 0.8rem;"></i>
                </div>
                <div class="typing-dots bg-light">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Quick Replies Area -->
        <div id="chat-options" class="chat-options bg-light px-2 pb-2">
            <!-- Suggested chips will appear here -->
        </div>

        <!-- Input Area -->
        <div class="chat-input-area border-top p-2 bg-white">
            <div class="input-group">
                <input type="text" id="chat-input" class="form-control border-success" placeholder="Hỏi tôi bất cứ điều gì..."
                    onkeypress="handleKeyPress(event)" autocomplete="off">
                <button class="btn btn-success" type="button" onclick="sendUserMessage()" id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    #chat-widget-container {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 1050;
        font-family: 'Roboto', sans-serif;
    }

    .chat-btn {
        background: linear-gradient(135deg, #28a745, #20c997);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 12px 22px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
    }

    .chat-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4) !important;
    }

    .chat-btn-text {
        font-weight: 600;
        font-size: 0.95rem;
    }

    .chat-box {
        position: fixed;
        bottom: 85px;
        right: 25px;
        width: 380px;
        height: 520px;
        max-height: calc(100vh - 180px);
        background: white;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2) !important;
        border: 1px solid rgba(0,0,0,0.05);
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background-color: #f8f9fa;
        scroll-behavior: smooth;
    }

    /* Message Styles */
    .message-wrapper {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 90%;
    }
    
    .message-wrapper.bot {
        align-self: flex-start;
    }
    
    .message-wrapper.user {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .bot-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: #28a745;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        flex-shrink: 0;
    }

    .message {
        padding: 10px 14px;
        border-radius: 18px;
        font-size: 0.92rem;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .message.bot {
        background-color: #ffffff;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(0,0,0,0.05);
    }

    .message.user {
        background-color: #e8f5e9;
        color: #1b5e20;
        border-bottom-right-radius: 4px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    
    .message.bot p {
        margin-bottom: 0.5rem;
    }
    
    .message.bot p:last-child {
        margin-bottom: 0;
    }
    
    .message.bot ul, .message.bot ol {
        padding-left: 1.2rem;
        margin-bottom: 0;
    }

    /* Product Cards inside Chat */
    .chat-product-list {
        display: flex;
        overflow-x: auto;
        gap: 12px;
        padding: 5px 2px 10px;
        max-width: 100%;
        scrollbar-width: none; /* Firefox */
        align-self: flex-start;
        margin-left: 36px; /* align with text */
    }
    
    .chat-product-list::-webkit-scrollbar {
        display: none; /* Chrome */
    }

    .chat-product-card {
        min-width: 150px;
        max-width: 150px;
        border: 1px solid #eaeaea;
        border-radius: 12px;
        overflow: hidden;
        background: white;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        transition: transform 0.2s;
    }
    
    .chat-product-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 12px rgba(0,0,0,0.08);
    }

    .chat-product-img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        background-color: #f8f9fa;
    }

    .chat-product-body {
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .chat-product-title {
        font-size: 0.85rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #2d3436;
    }

    .chat-product-price {
        color: #28a745;
        font-weight: 800;
        font-size: 0.9rem;
    }

    /* Quick Options (Chips) */
    .chat-options {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-top: 8px;
        scrollbar-width: none;
    }
    
    .chat-options::-webkit-scrollbar {
        display: none;
    }

    .option-btn {
        background-color: #fff;
        border: 1px solid #28a745;
        color: #28a745;
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .option-btn:hover {
        background-color: #28a745;
        color: white;
    }

    /* Typing Indicator */
    .typing-dots {
        background-color: #fff;
        padding: 10px 14px;
        border-radius: 18px;
        border-bottom-left-radius: 4px;
        display: inline-flex;
        gap: 4px;
        border: 1px solid rgba(0,0,0,0.05);
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .typing-dots span {
        width: 6px;
        height: 6px;
        background-color: #adb5bd;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
        40% { transform: scale(1); opacity: 1; }
    }

    /* Mobile Responsive */
    @media (max-width: 576px) {
        .chat-box {
            width: calc(100vw - 30px);
            right: 15px;
            bottom: 85px;
            height: calc(100vh - 120px);
            max-height: 600px;
        }
        #chat-widget-container {
            right: 15px;
            bottom: 15px;
        }
    }
</style>

<script>
    let isChatOpen = false;
    let hasInitialized = false;

    // Configure marked.js to be safe and open links in new tab
    if (typeof marked !== 'undefined') {
        marked.setOptions({
            breaks: true,
            gfm: true
        });
        
        // Open links in new tab
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a target="_blank" rel="noopener noreferrer" href="${href}">${text}</a>`;
        };
        marked.use({ renderer });
    }

    function toggleChat() {
        const chatBox = document.getElementById('chat-box');
        const badge = document.getElementById('chat-badge');
        isChatOpen = !isChatOpen;

        if (isChatOpen) {
            chatBox.classList.remove('d-none');
            badge.style.display = 'none'; // Hide notification badge
            
            if (!hasInitialized) {
                // Check if we have previous session history (just visual check)
                const msgs = document.getElementById('chat-messages').children.length;
                if (msgs === 0) {
                    sendApiRequest("Xin chào", true); // Secret greeting
                }
                hasInitialized = true;
            }
            
            setTimeout(() => document.getElementById('chat-input').focus(), 300);
            scrollToBottom();
        } else {
            chatBox.classList.add('d-none');
        }
    }

    function scrollToBottom() {
        const messagesDiv = document.getElementById('chat-messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addMessage(text, sender, isMarkdown = false) {
        const messagesDiv = document.getElementById('chat-messages');
        
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${sender} animate__animated animate__fadeInUp animate__faster`;
        
        let avatarHtml = '';
        if (sender === 'bot') {
            avatarHtml = `<div class="bot-avatar"><i class="fas fa-robot"></i></div>`;
        }
        
        // Parse markdown if it's bot and marked is available
        let contentHtml = text;
        if (sender === 'bot' && isMarkdown && typeof marked !== 'undefined') {
            try {
                // Gemini might return JSON strings with \n instead of actual newlines sometimes
                const unescapedText = text.replace(/\\n/g, '\n');
                contentHtml = marked.parse(unescapedText);
            } catch (e) {
                console.error("Markdown parse error:", e);
                contentHtml = text; // fallback
            }
        }
        
        wrapper.innerHTML = `
            ${avatarHtml}
            <div class="message ${sender}">
                ${contentHtml}
            </div>
        `;
        
        messagesDiv.appendChild(wrapper);
        scrollToBottom();
    }

    function addProductCarousel(products) {
        if (!products || products.length === 0) return;

        const messagesDiv = document.getElementById('chat-messages');
        const container = document.createElement('div');
        container.className = 'chat-product-list animate__animated animate__fadeInUp';

        products.forEach(p => {
            const imageHtml = p.image_url
                ? `<img src="${p.image_url}" class="chat-product-img">`
                : `<div class="chat-product-img d-flex align-items-center justify-content-center text-muted" style="font-size:2rem;"><i class="fas fa-leaf"></i></div>`;

            const cardHtml = `
                    <div class="chat-product-card">
                        ${imageHtml}
                        <div class="chat-product-body">
                            <div class="chat-product-title" title="${p.name}">${p.name}</div>
                            <div class="chat-product-price">
                                ${new Intl.NumberFormat('vi-VN').format(p.price)}đ
                            </div>
                            <a href="${p.url}" class="btn btn-success btn-sm w-100 p-0 py-1 mt-1 rounded-pill" style="font-size:0.75rem">Xem Chi Tiết</a>
                        </div>
                    </div>
             `;
            container.innerHTML += cardHtml;
        });

        messagesDiv.appendChild(container);
        scrollToBottom();
    }
    
    function renderSuggestedReplies(replies) {
        const optionsDiv = document.getElementById('chat-options');
        optionsDiv.innerHTML = ''; // clear old
        
        if (!replies || replies.length === 0) {
            optionsDiv.classList.add('d-none');
            return;
        }
        
        optionsDiv.classList.remove('d-none');
        replies.forEach(reply => {
            const btn = document.createElement('button');
            btn.className = 'option-btn animate__animated animate__fadeIn';
            btn.innerText = reply;
            btn.onclick = () => {
                document.getElementById('chat-input').value = reply;
                sendUserMessage();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendUserMessage();
        }
    }

    function sendUserMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        
        // Hide options right away
        document.getElementById('chat-options').innerHTML = '';
        document.getElementById('chat-options').classList.add('d-none');

        sendApiRequest(text, false);
    }

    async function sendApiRequest(message, isSilent = false) {
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const indicator = document.getElementById('typing-indicator');
        
        if (!isSilent) {
            input.disabled = true;
            sendBtn.disabled = true;
        }
        
        indicator.classList.remove('d-none');
        scrollToBottom();

        try {
            const response = await fetch('/ai-recognition/chat-api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) throw new Error('API Error');
            const data = await response.json();

            // Hide typing indicator
            indicator.classList.add('d-none');

            // Render Bot Message (Markdown supported)
            addMessage(data.message, 'bot', true);

            // Render Product Cards if any
            if (data.data && data.data.length > 0) {
                addProductCarousel(data.data);
            }
            
            // Render quick chips
            renderSuggestedReplies(data.suggested_replies);

        } catch (error) {
            console.error('Chat Error:', error);
            indicator.classList.add('d-none');
            addMessage("Xin lỗi, hệ thống đang bận. Bạn vui lòng thử lại sau.", 'bot');
        } finally {
            if (!isSilent) {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
            scrollToBottom();
        }
    }

    // Helper to get CSRF
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
